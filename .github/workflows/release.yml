name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'SayatYuss/donwloader-private'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and verification tools
        run: python -m pip install build twine
      - name: Validate tag matches package version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from packaging.version import Version
          from importlib.metadata import PackageNotFoundError
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = Version(project["version"])
          if not tag.startswith("v") or Version(tag[1:]) != expected:
              raise SystemExit(f"Tag {tag} does not match package version {expected}")
          print(f"Release version: {expected}")
          PY
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: |
          python -m pip install '.[desktop,http,telegram,images]'
          python -m unittest discover -s tests -v
          ranobe --version
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Verify wheel can be installed
        shell: bash
        run: |
          python -m venv /tmp/ranobe-wheel-test
          /tmp/ranobe-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/ranobe-wheel-test/bin/ranobe --version
          /tmp/ranobe-wheel-test/bin/ranobe download --help
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Web UI distribution
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Package Web UI as static archive
        shell: bash
        run: tar -czf "dist/ranobe-web-${GITHUB_REF_NAME}.tar.gz" -C web/dist .
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease_flag=""
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc|dev)[0-9]+ ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease_flag \
            --verify-tag

  desktop:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/pyside6-desktop.yml
