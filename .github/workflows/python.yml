name: Python checks

on:
  push:
    branches: [develop, main, "feature/**", "docs/**", "release/**"]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install -e '.[http,telegram]'
      - name: CLI smoke test
        run: ranobe --help && ranobe --version && ranobe download --help
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  distribution:
    name: Python distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and validate package
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Verify clean wheel installation
        run: |
          python -m venv /tmp/package-smoke
          /tmp/package-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/package-smoke/bin/python -c "from ranobe_downloader import Downloader"
          /tmp/package-smoke/bin/ranobe --version
          /tmp/package-smoke/bin/ranobe download --help
