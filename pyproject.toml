[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ranobe-downloader"
version = "0.4.0"
description = "RanobeLib downloader with PySide6 desktop, CLI, Python API, Web UI, HTTP API and Telegram bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "keyring>=25,<27",
]
authors = [{name = "SayatYuss"}]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
images = ["Pillow>=10,<13"]
http = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
telegram = ["python-telegram-bot>=21.10,<23"]
desktop = ["PySide6>=6.7,<7"]

[project.scripts]
ranobe = "main:main"
ranobe-bot = "interfaces.telegram.ui:main"
ranobe-desktop = "interfaces.pyside6.app:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "providers*", "exporters*", "interfaces*", "ranobe_downloader*"]
namespaces = true
exclude = ["tests*"]
