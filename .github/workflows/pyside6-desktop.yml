name: PySide6 desktop

on:
  push:
    branches: ["feature/pyside6-desktop"]
    paths:
      - "interfaces/pyside6/**"
      - "pyproject.toml"
      - ".github/workflows/pyside6-desktop.yml"
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

jobs:
  package:
    if: >-
      github.repository == 'SayatYuss/donwloader-private' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-15
            platform: macos
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux Qt runtime libraries
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Install requirements
        shell: bash
        run: python -m pip install '.[desktop,images]' 'pyinstaller>=6,<7'
      - name: Headless import check
        shell: bash
        run: python -m interfaces.pyside6.app --check
      - name: Build desktop app
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --name RanobeDownloader \
            --collect-submodules keyring.backends \
            --collect-submodules PySide6 \
            ${{ matrix.platform == 'windows' && '--onefile --noconsole' || '--onedir' }} \
            ${{ matrix.platform == 'macos' && '--windowed' || '' }} \
            interfaces/pyside6/app.py
      - name: Windows EXE
        if: matrix.platform == 'windows'
        shell: bash
        run: cp dist/RanobeDownloader.exe RanobeDownloader-Windows-x64.exe
      - name: macOS DMG
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir dmg
          cp -R dist/RanobeDownloader.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname RanobeDownloader -srcfolder dmg -ov -format UDZO RanobeDownloader-macOS.dmg
      - name: Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          python -m pip install -q cairosvg
          mkdir -p AppDir/usr/bin
          cp -a dist/RanobeDownloader/. AppDir/usr/bin/
          cp packaging/ranobe.desktop AppDir/ranobe.desktop
          cp packaging/AppRun AppDir/AppRun
          python -c 'import cairosvg; cairosvg.svg2png(url="packaging/ranobe.svg", write_to="AppDir/ranobe.png", output_width=256, output_height=256)'
          chmod +x AppDir/AppRun
          curl --fail --location --retry 3 https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract >/dev/null
          ARCH=x86_64 ./squashfs-root/AppRun AppDir RanobeDownloader-Linux-x86_64.AppImage
      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyside6-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            RanobeDownloader-Windows-x64.exe
            RanobeDownloader-macOS.dmg
            RanobeDownloader-Linux-x86_64.AppImage
      - name: Upload to GitHub Release
        if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          case "${{ matrix.platform }}" in
            windows) file="RanobeDownloader-Windows-x64.exe" ;;
            macos) file="RanobeDownloader-macOS.dmg" ;;
            linux) file="RanobeDownloader-Linux-x86_64.AppImage" ;;
          esac
          gh release upload "$RELEASE_TAG" "$file" --clobber
