[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ranobe-downloader"
version = "0.1.0a1"
description = "RanobeLib command-line EPUB downloader"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "keyring>=25,<27",
]
[project.optional-dependencies]
images = ["Pillow>=10,<13"]

authors = [{name = "SayatYuss"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
ranobe = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "providers*", "exporters*", "interfaces*"]
namespaces = true
exclude = ["tests*"]
