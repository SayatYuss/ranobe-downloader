name: Python checks

on:
  push:
    branches: [develop, main, "feature/**", "docs/**", "release/**"]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install -e '.[http,telegram]'
      - name: CLI smoke test
        run: ranobe --help && ranobe --version && ranobe download --help
      - name: Unit tests
        run: python -m unittest discover -s tests -v
