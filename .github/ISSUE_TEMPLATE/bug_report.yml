name: Ошибка
description: Сообщить о воспроизводимой проблеме
body:
  - type: markdown
    attributes:
      value: Не публикуйте токены и персональные данные. Удалите их из логов и скриншотов.
  - type: input
    id: version
    attributes:
      label: Версия приложения
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: ОС и способ запуска
      placeholder: Ubuntu / AppImage, Windows / EXE, Python / CLI…
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Шаги воспроизведения
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый и фактический результат
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Обезличенные логи
      render: text
